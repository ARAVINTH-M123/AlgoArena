services:
  - type: web
    name: algoarena-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    numInstances: 1
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: APP_CORS_ALLOWED_ORIGIN_PATTERNS
        value: https://algoarena.open-next.workers.dev
      - key: APP_PROBLEM_IMPORT_ENABLED
        value: true
      - key: DB_URL
        sync: false
      - key: APP_JWT_SECRET
        sync: false
      - key: ADMIN_BOOTSTRAP_ENABLED
        value: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

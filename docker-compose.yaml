services:
  postgres:
    image: postgres:17
    container_name: algoarena-postgres
    environment:
      POSTGRES_DB: problem_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Itspostgresql
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:

substitutions:
  _REGION: asia-south1
  _REPOSITORY: algoarena
  _SERVICE_NAME: algoarena-api
  _SERVICE_ACCOUNT: algoarena-runner@${PROJECT_ID}.iam.gserviceaccount.com

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${BUILD_ID}
      - ./backend

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${BUILD_ID}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${BUILD_ID}
      - --region=${_REGION}
      - --platform=managed
      - --service-account=${_SERVICE_ACCOUNT}
      - --allow-unauthenticated
      - --port=8080
      - --cpu=1
      - --memory=1Gi
      - --concurrency=20
      - --min-instances=0
      - --max-instances=1
      - --timeout=300
      - --set-env-vars=SPRING_PROFILES_ACTIVE=prod,APP_CORS_ALLOWED_ORIGIN_PATTERNS=https://algoarena.open-next.workers.dev,ADMIN_BOOTSTRAP_ENABLED=false
      - --set-secrets=DB_URL=algoarena-prisma-db-url:latest,APP_JWT_SECRET=algoarena-jwt-secret:latest

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${BUILD_ID}

options:
  dynamicSubstitutions: true
  logging: CLOUD_LOGGING_ONLY

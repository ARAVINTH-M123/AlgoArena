spring:
  application:
    name: problem-solving-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/problem_platform}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:itspostgresql}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: never
  threads:
    virtual:
      enabled: true

server:
  port: 8080

app:
  jwt:
    secret: cHJvYmxlbS1zb2x2aW5nLXBsYXRmb3JtLXNlY3VyZS1qd3Qtc2VjcmV0LWtleS0yMDI2
    expiration-ms: 86400000
nation:
  award-enabled: true
  xp-multiplier: 1
  # Phase 7 retention (defaults live in NationProperties; uncomment to override):
  # daily-goal-solves: 3            # first solves per local day that fill the goal
  # daily-goal-bonus-percent: 50    # extra XP for each solve while the day is under the goal
  # comeback-gap-days: 14           # days away that make the next first solve a comeback
  # comeback-bonus-points: 100      # flat comeback XP in whole points
